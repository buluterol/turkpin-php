name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, simplexml
      - name: Skip Laravel tests on PHP 8.1
        if: matrix.php == '8.1'
        run: composer remove --dev --no-update orchestra/testbench
      - run: composer install --no-interaction --no-progress
      - run: composer test
