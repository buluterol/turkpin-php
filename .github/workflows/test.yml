name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, simplexml
      # Laravel 10 (the last release for PHP 8.1) is blocked by security advisories, so testbench cannot be installed
      - name: Skip Laravel tests on PHP 8.1
        if: matrix.php == '8.1'
        run: |
          composer remove --dev --no-update orchestra/testbench
          rm tests/Integration/LaravelTest.php
      - run: composer install --no-interaction --no-progress
      - run: composer test
